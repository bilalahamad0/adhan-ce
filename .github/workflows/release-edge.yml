name: Release (Edge)

# Builds the Edge ZIP when an edge-v*.*.* tag is pushed, attaches it to a draft
# GitHub Release, and (if the Edge API secrets are set) submits it to Microsoft
# Edge Add-ons for review. A manual workflow_dispatch run with `release` ticked
# does the same without a pushed tag: it tags the commit edge-v<manifest
# version> itself. Other manual runs produce the ZIP as an artifact only.
#
# Tag convention (see RELEASING.md): chrome-v* → Chrome Web Store (release.yml),
# firefox-v* → Firefox/AMO (release-firefox.yml), edge-v* → Edge Add-ons (here).
# The bare v* trigger is RETIRED — release-tag-guard.yml fails loudly on one.
#
# Edge needs no signing key: unlike the Chrome CRX there is nothing to sign
# locally, and unlike AMO nothing is signed server-side either. The ZIP is the
# artifact.

on:
  push:
    tags:
      - 'edge-v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag, branch or full 40-character commit SHA to build (defaults to the commit the run starts on). Without `release` no release is created — the ZIP is uploaded as a workflow artifact only.'
        required: false
      release:
        description: 'Release to Edge Add-ons: tag this commit edge-v<manifest version> and run the same steps as a tag push. For main''s tip: run on main and leave `ref` empty.'
        type: boolean
        default: false

permissions:
  contents: write # needed for the release step to create draft releases (and a manual release's tag)

jobs:
  release:
    name: Build & attach Edge ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Empty for a tag push or a run without `ref`: checkout then builds
          # github.sha, the pushed or dispatched commit, on re-runs too.
          ref: ${{ inputs.ref }}
          fetch-depth: 0 # a manual release checks the commit against main

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      # A release is an edge-v* tag push, or a manual run with `release` ticked.
      # The manual path tags this commit edge-v<manifest version> itself (later
      # in the job, once tests and the version check pass), for when a tag
      # cannot be pushed from where the release is started. Both paths then run
      # the same steps. A manual release must build main's tip (or a commit on
      # main with the same workflow files), and if the tag already exists it
      # must point at this commit (a re-run of the same release), never at
      # another one.
      - name: Resolve release mode
        id: mode
        env:
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./manifest.json').version")"
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [[ "$GITHUB_REF" == refs/tags/edge-v* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$RELEASE_INPUT" = "true" ]; then
            TAG="edge-v$VERSION"
            git fetch --quiet --no-tags origin main
            if ! git merge-base --is-ancestor "$HEAD_SHA" origin/main; then
              echo "::error::A release must build a commit on main; $HEAD_SHA is not on origin/main."
              exit 1
            fi
            CREATE=true
            if git fetch --quiet --no-tags origin "+refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null; then
              TAGGED="$(git rev-parse "refs/tags/$TAG^{commit}")"
              if [ "$TAGGED" != "$HEAD_SHA" ]; then
                echo "::error::Tag $TAG already exists on $TAGGED, not on $HEAD_SHA. Bump the version, or, if version $VERSION reached no store, delete the tag and run again."
                exit 1
              fi
              CREATE=false
            fi
            # GitHub refuses a ref created with GITHUB_TOKEN on a commit whose
            # workflow files differ from main's tip (that needs the workflows
            # permission), so only main's tip, or a commit with its workflows,
            # can be tagged here. Fail now rather than after the tests.
            if [ "$CREATE" = true ] && ! git diff --quiet "$HEAD_SHA" origin/main -- .github/workflows; then
              echo "::error::The .github/workflows of $HEAD_SHA differ from main's tip, where this job cannot create a tag. Release main's tip (run on main without \`ref\`), or push the tag $TAG yourself."
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "create_tag=$CREATE" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run jest tests with coverage (enforces thresholds)
        run: npm run test:cov

      - name: Verify tag matches manifest/package/lock versions (release only)
        if: steps.mode.outputs.release == 'true'
        env:
          TAG: ${{ steps.mode.outputs.tag }}
        run: |
          set -euo pipefail
          TAG_VERSION="${TAG#edge-v}"
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          LOCK_VERSION="$(node -p "require('./package-lock.json').version")"
          LOCK_PKG_VERSION="$(node -p "require('./package-lock.json').packages[''].version")"
          DRIFT=0
          for v in "$MANIFEST_VERSION" "$PKG_VERSION" "$LOCK_VERSION" "$LOCK_PKG_VERSION"; do
            [ "$TAG_VERSION" = "$v" ] || DRIFT=1
          done
          if [ "$DRIFT" = "1" ]; then
            echo "::error::Version drift — tag=$TAG_VERSION manifest=$MANIFEST_VERSION package=$PKG_VERSION lock=$LOCK_VERSION lock.packages[\"\"]=$LOCK_PKG_VERSION. All four must equal the tag."
            exit 1
          fi
          echo "Tag ↔ manifest/package/lock all match: $TAG_VERSION"

      # Manual release only: a tag push already has its tag. Pushed with the
      # job's GITHUB_TOKEN, which starts no other workflow run, so the tag does
      # not set off a second release of the same version.
      - name: Create the release tag (manual release only)
        if: steps.mode.outputs.create_tag == 'true'
        env:
          TAG: ${{ steps.mode.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$TAG" HEAD
          git push origin "refs/tags/$TAG"
          echo "Tagged $(git rev-parse --short HEAD) as $TAG"

      - name: Compute output paths
        id: ver
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./manifest.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip_path=adhan-focus-$VERSION-edge.zip" >> "$GITHUB_OUTPUT"

      - name: Pack Edge ZIP
        run: |
          set -euo pipefail
          node scripts/pack-edge.mjs "${{ steps.ver.outputs.zip_path }}"
          ls -la "${{ steps.ver.outputs.zip_path }}"

      - name: Upload ZIP as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.ver.outputs.zip_path }}
          path: ${{ steps.ver.outputs.zip_path }}
          retention-days: 14
          if-no-files-found: error

      - name: Create draft GitHub Release with ZIP attached (release only)
        if: steps.mode.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.ver.outputs.zip_path }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          tag_name: ${{ steps.mode.outputs.tag }}
          target_commitish: ${{ steps.mode.outputs.sha }}
          name: ${{ steps.mode.outputs.tag }}

      # Upload to Edge Add-ons and submit for review. Releases only. No-ops
      # (leaving the release succeeding) when the API secrets aren't configured,
      # so the build/release pipeline keeps working before — or without — store
      # automation. See .github/RELEASE_SETUP.md → "Automating Edge submission".
      - name: Submit to Edge Add-ons (release only)
        if: steps.mode.outputs.release == 'true'
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${EDGE_PRODUCT_ID:-}" ] || [ -z "${EDGE_CLIENT_ID:-}" ] || [ -z "${EDGE_API_KEY:-}" ]; then
            echo "::notice::Edge API secrets not set — skipping store submission. The ZIP is on the GitHub Release; upload it manually at Partner Center, or configure the secrets (see .github/RELEASE_SETUP.md) to automate this."
            exit 0
          fi
          node scripts/submit-edge.mjs "${{ steps.ver.outputs.zip_path }}"
