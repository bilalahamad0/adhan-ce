name: Release (Opera)

# Builds the Opera Add-ons ZIP when an opera-v*.*.* tag is pushed, attaches it to
# a draft GitHub Release, and uploads it as an artifact. Manual workflow_dispatch
# runs produce the ZIP as an artifact only.
#
# Tag convention (see RELEASING.md):
#   chrome-v*  → Chrome Web Store (release.yml)
#   firefox-v* → Firefox/AMO (release-firefox.yml)
#   edge-v*    → Microsoft Edge Add-ons (release-edge.yml)
#   opera-v*   → Opera Add-ons (here)

on:
  push:
    tags:
      - 'opera-v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or commit to build (defaults to current branch HEAD). No release is created on manual dispatch — the ZIP is uploaded as a workflow artifact only.'
        required: false

permissions:
  contents: write # needed for the release step to create draft releases

jobs:
  release:
    name: Build & attach Opera ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run jest tests with coverage (enforces thresholds)
        run: npm run test:cov

      - name: Verify tag matches manifest/package/lock versions (tag push only)
        if: startsWith(github.ref, 'refs/tags/opera-v')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#opera-v}"
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          LOCK_VERSION="$(node -p "require('./package-lock.json').version")"
          LOCK_PKG_VERSION="$(node -p "require('./package-lock.json').packages[''].version")"
          DRIFT=0
          for v in "$MANIFEST_VERSION" "$PKG_VERSION" "$LOCK_VERSION" "$LOCK_PKG_VERSION"; do
            [ "$TAG_VERSION" = "$v" ] || DRIFT=1
          done
          if [ "$DRIFT" = "1" ]; then
            echo "::error::Version drift — tag=$TAG_VERSION manifest=$MANIFEST_VERSION package=$PKG_VERSION lock=$LOCK_VERSION lock.packages[\"\"]=$LOCK_PKG_VERSION. All four must equal the tag."
            exit 1
          fi
          echo "Tag ↔ manifest/package/lock all match: $TAG_VERSION"

      - name: Compute output paths
        id: ver
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./manifest.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip_path=adhan-focus-$VERSION-opera.zip" >> "$GITHUB_OUTPUT"

      - name: Pack Opera ZIP
        run: |
          set -euo pipefail
          node scripts/pack-opera.mjs "${{ steps.ver.outputs.zip_path }}"
          ls -la "${{ steps.ver.outputs.zip_path }}"

      - name: Upload ZIP as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.ver.outputs.zip_path }}
          path: ${{ steps.ver.outputs.zip_path }}
          retention-days: 14
          if-no-files-found: error

      - name: Create draft GitHub Release with ZIP attached (tag push only)
        if: startsWith(github.ref, 'refs/tags/opera-v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.ver.outputs.zip_path }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          name: ${{ github.ref_name }}
