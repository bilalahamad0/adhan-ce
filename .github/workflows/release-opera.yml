name: Release (Opera)

# Builds the Opera Add-ons ZIP when an opera-v*.*.* tag is pushed, attaches it to
# a draft GitHub Release, and uploads it as an artifact. A manual
# workflow_dispatch run with `release` ticked does the same without a pushed
# tag: it tags the commit opera-v<manifest version> itself. Other manual runs
# produce the ZIP as an artifact only. Opera has no upload API: the ZIP from the
# draft release is uploaded in the Opera developer dashboard.
#
# Tag convention (see RELEASING.md):
#   chrome-v*  → Chrome Web Store (release.yml)
#   firefox-v* → Firefox/AMO (release-firefox.yml)
#   edge-v*    → Microsoft Edge Add-ons (release-edge.yml)
#   opera-v*   → Opera Add-ons (here)

on:
  push:
    tags:
      - 'opera-v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or commit to build (defaults to current branch HEAD). Without `release` no release is created — the ZIP is uploaded as a workflow artifact only.'
        required: false
      release:
        description: 'Release for Opera Add-ons: tag this commit opera-v<manifest version> and attach the ZIP to a draft release, as a tag push does. Only for a commit on main.'
        type: boolean
        default: false

permissions:
  contents: write # needed for the release step to create draft releases (and a manual release's tag)

jobs:
  release:
    name: Build & attach Opera ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0 # a manual release checks the commit is on main

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      # A release is an opera-v* tag push, or a manual run with `release` ticked.
      # The manual path tags this commit opera-v<manifest version> itself (later
      # in the job, once tests and the version check pass), for when a tag
      # cannot be pushed from where the release is started. Both paths then run
      # the same steps. A manual release must build a commit on main, and if the
      # tag already exists it must point at this commit (a re-run of the same
      # release), never at another one.
      - name: Resolve release mode
        id: mode
        env:
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./manifest.json').version")"
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [[ "$GITHUB_REF" == refs/tags/opera-v* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$RELEASE_INPUT" = "true" ]; then
            TAG="opera-v$VERSION"
            git fetch --quiet --no-tags origin main
            if ! git merge-base --is-ancestor "$HEAD_SHA" origin/main; then
              echo "::error::A release must build a commit on main; $HEAD_SHA is not on origin/main."
              exit 1
            fi
            CREATE=true
            if git fetch --quiet --no-tags origin "+refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null; then
              TAGGED="$(git rev-parse "refs/tags/$TAG^{commit}")"
              if [ "$TAGGED" != "$HEAD_SHA" ]; then
                echo "::error::Tag $TAG already exists on $TAGGED, not on $HEAD_SHA. Version $VERSION was released from another commit: bump the version first."
                exit 1
              fi
              CREATE=false
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "create_tag=$CREATE" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run jest tests with coverage (enforces thresholds)
        run: npm run test:cov

      - name: Verify tag matches manifest/package/lock versions (release only)
        if: steps.mode.outputs.release == 'true'
        env:
          TAG: ${{ steps.mode.outputs.tag }}
        run: |
          set -euo pipefail
          TAG_VERSION="${TAG#opera-v}"
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          LOCK_VERSION="$(node -p "require('./package-lock.json').version")"
          LOCK_PKG_VERSION="$(node -p "require('./package-lock.json').packages[''].version")"
          DRIFT=0
          for v in "$MANIFEST_VERSION" "$PKG_VERSION" "$LOCK_VERSION" "$LOCK_PKG_VERSION"; do
            [ "$TAG_VERSION" = "$v" ] || DRIFT=1
          done
          if [ "$DRIFT" = "1" ]; then
            echo "::error::Version drift — tag=$TAG_VERSION manifest=$MANIFEST_VERSION package=$PKG_VERSION lock=$LOCK_VERSION lock.packages[\"\"]=$LOCK_PKG_VERSION. All four must equal the tag."
            exit 1
          fi
          echo "Tag ↔ manifest/package/lock all match: $TAG_VERSION"

      # Manual release only: a tag push already has its tag. Pushed with the
      # job's GITHUB_TOKEN, which starts no other workflow run, so the tag does
      # not set off a second release of the same version.
      - name: Create the release tag (manual release only)
        if: steps.mode.outputs.create_tag == 'true'
        env:
          TAG: ${{ steps.mode.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$TAG" HEAD
          git push origin "refs/tags/$TAG"
          echo "Tagged $(git rev-parse --short HEAD) as $TAG"

      - name: Compute output paths
        id: ver
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./manifest.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip_path=adhan-focus-$VERSION-opera.zip" >> "$GITHUB_OUTPUT"

      - name: Pack Opera ZIP
        run: |
          set -euo pipefail
          node scripts/pack-opera.mjs "${{ steps.ver.outputs.zip_path }}"
          ls -la "${{ steps.ver.outputs.zip_path }}"

      - name: Upload ZIP as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.ver.outputs.zip_path }}
          path: ${{ steps.ver.outputs.zip_path }}
          retention-days: 14
          if-no-files-found: error

      - name: Create draft GitHub Release with ZIP attached (release only)
        if: steps.mode.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.ver.outputs.zip_path }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          tag_name: ${{ steps.mode.outputs.tag }}
          target_commitish: ${{ steps.mode.outputs.sha }}
          name: ${{ steps.mode.outputs.tag }}
