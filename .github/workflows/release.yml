name: Release (Chrome)

# Builds a signed CRX when a chrome-v*.*.* tag is pushed, attaches it to a draft
# GitHub Release, and (if the CWS secrets are set) submits it to the Chrome Web
# Store. A manual workflow_dispatch run with `release` ticked does the same
# without a pushed tag: it tags the commit chrome-v<manifest version> itself.
# Other manual runs produce the CRX as an artifact only.
#
# Tag convention (see RELEASING.md): chrome-v* releases to Chrome; firefox-v*
# releases to Firefox/AMO (release-firefox.yml). The bare v* trigger is RETIRED
# — release-tag-guard.yml fails loudly if a bare v* tag is pushed, so the live
# Chrome Web Store can never be hit by an ambiguous tag.
#
# Required repo secret:
#   CRX_PRIVATE_KEY_B64 — base64-encoded contents of adhan-caster-private.pem.
#                         See .github/RELEASE_SETUP.md for one-time setup.

on:
  push:
    tags:
      - 'chrome-v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or commit to build (defaults to current branch HEAD). Without `release` no release is created — the CRX is uploaded as a workflow artifact only.'
        required: false
      release:
        description: 'Release to the Chrome Web Store: tag this commit chrome-v<manifest version> and run the same steps as a tag push. Only for a commit on main.'
        type: boolean
        default: false

permissions:
  contents: write  # needed for the release step to create draft releases (and a manual release's tag)

jobs:
  release:
    name: Build & attach CRX
    runs-on: ubuntu-latest
    # One Chrome Web Store upload at a time: the v2 API reports async upload
    # progress per item, not per upload, so overlapping runs could misread it.
    # Only runs that can reach the store (chrome-v* tag refs, or a manual run
    # with `release`) share the group, so a plain build can never queue
    # against, or cancel, a pending release.
    concurrency:
      group: ${{ (startsWith(github.ref, 'refs/tags/chrome-v') || inputs.release) && 'cws-release' || format('chrome-build-{0}', github.run_id) }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0 # a manual release checks the commit is on main

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      # A release is a chrome-v* tag push, or a manual run with `release` ticked.
      # The manual path tags this commit chrome-v<manifest version> itself (later
      # in the job, once tests and the version check pass), for when a tag
      # cannot be pushed from where the release is started. Both paths then run
      # the same steps. A manual release must build a commit on main, and if the
      # tag already exists it must point at this commit (a re-run of the same
      # release), never at another one.
      - name: Resolve release mode
        id: mode
        env:
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./manifest.json').version")"
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [[ "$GITHUB_REF" == refs/tags/chrome-v* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$RELEASE_INPUT" = "true" ]; then
            TAG="chrome-v$VERSION"
            git fetch --quiet --no-tags origin main
            if ! git merge-base --is-ancestor "$HEAD_SHA" origin/main; then
              echo "::error::A release must build a commit on main; $HEAD_SHA is not on origin/main."
              exit 1
            fi
            CREATE=true
            if git fetch --quiet --no-tags origin "+refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null; then
              TAGGED="$(git rev-parse "refs/tags/$TAG^{commit}")"
              if [ "$TAGGED" != "$HEAD_SHA" ]; then
                echo "::error::Tag $TAG already exists on $TAGGED, not on $HEAD_SHA. Version $VERSION was released from another commit: bump the version first."
                exit 1
              fi
              CREATE=false
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "create_tag=$CREATE" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run jest tests with coverage (enforces thresholds)
        run: npm run test:cov

      - name: Verify tag matches manifest/package/lock versions (release only)
        if: steps.mode.outputs.release == 'true'
        env:
          TAG: ${{ steps.mode.outputs.tag }}
        run: |
          set -euo pipefail
          TAG_VERSION="${TAG#chrome-v}"
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          LOCK_VERSION="$(node -p "require('./package-lock.json').version")"
          LOCK_PKG_VERSION="$(node -p "require('./package-lock.json').packages[''].version")"
          DRIFT=0
          for v in "$MANIFEST_VERSION" "$PKG_VERSION" "$LOCK_VERSION" "$LOCK_PKG_VERSION"; do
            [ "$TAG_VERSION" = "$v" ] || DRIFT=1
          done
          if [ "$DRIFT" = "1" ]; then
            echo "::error::Version drift — tag=$TAG_VERSION manifest=$MANIFEST_VERSION package=$PKG_VERSION lock=$LOCK_VERSION lock.packages[\"\"]=$LOCK_PKG_VERSION. All four must equal the tag (v2.0.0 shipped with a stale lockfile; this check prevents a repeat)."
            exit 1
          fi
          echo "Tag ↔ manifest/package/lock all match: $TAG_VERSION"

      # Manual release only: a tag push already has its tag. Pushed with the
      # job's GITHUB_TOKEN, which starts no other workflow run, so the tag does
      # not set off a second release of the same version.
      - name: Create the release tag (manual release only)
        if: steps.mode.outputs.create_tag == 'true'
        env:
          TAG: ${{ steps.mode.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$TAG" HEAD
          git push origin "refs/tags/$TAG"
          echo "Tagged $(git rev-parse --short HEAD) as $TAG"

      - name: Compute output paths
        id: ver
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./manifest.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "crx_path=adhan-focus-$VERSION.crx" >> "$GITHUB_OUTPUT"

      - name: Decode private key
        env:
          CRX_PRIVATE_KEY_B64: ${{ secrets.CRX_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${CRX_PRIVATE_KEY_B64:-}" ]; then
            echo "::error::Required secret CRX_PRIVATE_KEY_B64 is not set."
            echo "::error::See .github/RELEASE_SETUP.md to configure it once."
            exit 1
          fi
          printf '%s' "$CRX_PRIVATE_KEY_B64" | base64 -d > key.pem
          chmod 600 key.pem
          # Sanity check: decoded bytes look like a PEM
          if ! head -1 key.pem | grep -q "BEGIN"; then
            echo "::error::Decoded CRX_PRIVATE_KEY_B64 does not look like a PEM file."
            echo "::error::Re-encode with: base64 -i adhan-caster-private.pem | pbcopy"
            exit 1
          fi

      - name: Pack signed CRX
        run: |
          set -euo pipefail
          node scripts/pack-crx.mjs key.pem "${{ steps.ver.outputs.crx_path }}"
          ls -la "${{ steps.ver.outputs.crx_path }}"

      - name: Upload CRX as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.ver.outputs.crx_path }}
          path: ${{ steps.ver.outputs.crx_path }}
          retention-days: 14
          if-no-files-found: error

      - name: Create draft GitHub Release with CRX attached (release only)
        if: steps.mode.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.ver.outputs.crx_path }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          tag_name: ${{ steps.mode.outputs.tag }}
          target_commitish: ${{ steps.mode.outputs.sha }}
          name: ${{ steps.mode.outputs.tag }}

      # Upload the signed CRX to the Chrome Web Store and submit it for review.
      # Releases only. No-ops (and leaves the release succeeding) when the
      # OAuth secrets aren't configured, so the build/sign/release pipeline keeps
      # working even before — or without — store automation set up. See
      # .github/RELEASE_SETUP.md → "Automating CWS submission" for the secrets.
      - name: Submit to Chrome Web Store (release only)
        if: steps.mode.outputs.release == 'true'
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          # Optional repo variable (not a secret); empty falls back to the
          # publisher ID built into scripts/submit-cws.mjs.
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CWS_CLIENT_ID:-}" ] || [ -z "${CWS_CLIENT_SECRET:-}" ] || [ -z "${CWS_REFRESH_TOKEN:-}" ]; then
            echo "::notice::CWS OAuth secrets not set — skipping store submission. The signed CRX is on the GitHub Release; upload it manually, or configure the secrets (see .github/RELEASE_SETUP.md) to automate this."
            exit 0
          fi
          node scripts/submit-cws.mjs "${{ steps.ver.outputs.crx_path }}"

      - name: Wipe private key from runner
        if: always()
        run: rm -f key.pem
